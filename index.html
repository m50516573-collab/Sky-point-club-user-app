.btn-view{padding:6px 10px;border-radius:8px;font-size:10px;font-weight:600;border:none;cursor:pointer}
.btn-go{background:var(--dark);color:#fff}
.btn-done{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.progress{height:2px;background:#F5F1E8;border-radius:10px;overflow:hidden;margin-top:6px}
.fill-bar{height:100%;transition:width .2s}
.modal{position:fixed;inset:0;background:rgba(248,246,241,.96);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(12px)}
