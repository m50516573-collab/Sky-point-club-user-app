<style>
:root{

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:90px}

/* COINPAYU STYLE HEADER — DARK */
.header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--dark2)}
.logo-area{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.balance-pill{background:var(--dark2);border:1px solid var(--dark3);padding:6px 12px;border-radius:20px;display:flex;gap:8px;align-items:center}
.bal{font-family:'JetBrains Mono';font-weight:600;font-size:13px;color:#fff}
.top-stats{display:flex;gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat-val{font-size:16px;font-weight:800;font-family:'JetBrains Mono';color:var(--text)}
.stat-label{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-top:2px;text-transform:uppercase}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card-blue{border-left:3px solid var(--blue);background:linear-gradient(90deg,rgba(59,130,246,.04),#fff)}
.input{width:100%;background:#fff;border:1px solid var(--line);padding:11px 12px;border-radius:10px;font-size:13px;font-weight:500;outline:none;font-family:'Inter';transition:.15s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.btn{width:100%;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';transition:.15s}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--dark);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-dark)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:10px 14px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tabs button{flex:1;padding:8px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:11px;cursor:pointer;font-family:'Inter'}
.tabs button.active{background:var(--dark);color:#fff}

/* COINPAYU AD LIST — TABLE STYLE */
.ad-table{margin:10px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ad-header{display:flex;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.ad-row{display:flex;align-items:center;padding:11px 12px;border-bottom:1px solid #F1F5F9;transition:.15s;background:var(--card)}
.ad-row:last-child{border-bottom:none}
.ad-row:hover{background:var(--card-hover)}
.ad-row.disabled{opacity:.45;pointer-events:none;background:#F8FAFC}
.col-icon{width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.col-main{flex:1;min-width:0;margin-left:10px}
.col-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-sub{font-size:10px;color:var(--muted);margin-top:1px;display:flex;gap:6px}
.col-reward{text-align:center;min-width:60px}
.reward-val{font-size:12px;font-weight:700;font-family:'JetBrains Mono';color:var(--green)}
.reward-label{font-size:9px;color:var(--muted)}
.col-action{min-width:70px;text-align:right}
.btn-view{padding:6px 12px;border-radius:7px;font-size:10px;font-weight:700;border:none;cursor:pointer;font-family:'Inter'}
.btn-view-go{background:var(--dark);color:#fff}
.btn-view-go:hover{background:var(--dark2)}
.btn-view-done{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.progress{height:3px;background:var(--bg);border-radius:10px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--dark);transition:width .3s}
.nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:calc(100% - 12px);max-width:470px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-around;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:99}
.nav button{background:none;border:none;color:var(--muted);font-size:9px;font-weight:600;padding:7px 6px;border-radius:10px;cursor:pointer;font-family:'Inter';display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.active{background:var(--dark);color:#fff}
.rule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
.rule-title{font-size:10px;font-weight:700;color:var(--dark);margin-bottom:2px}
.rule-text{font-size:10px;color:var(--muted);line-height:1.5}
.ref-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

function getLimits(){const raw=JSON.parse(localStorage.getItem('sky_coinpayu_limits')||'{}');const now=Date.now(),ms=8*3600000;if(raw.reset&&now>raw.reset){localStorage.removeItem('sky_coinpayu_limits');return{reset:now+ms};}if(!raw.reset)raw.reset=now+ms;return raw;}

window.doAction=async()=>{

    }catch(e){msg.style.color='var(--red)'; msg.textContent=e.message; btn.disabled=false}

    AD_LIST.forEach((ad,i)=>{
