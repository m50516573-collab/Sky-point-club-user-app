<style>

.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #eef0f2}
.btn{border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;width:100%;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-green{background:#0a7a2a;color:#fff}

.btn-light{background:#eef7ee;color:#0a7a2a;border:1px solid #c8e6c9}

.action small{display:block;font-weight:400;opacity:.9;margin-top:2px;font-size:12px}
.topbar{max-width:480px;margin:0 auto}
.wrap{max-width:480px;margin:0 auto;padding-bottom:90px;min-height:100vh}

<body>

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyBXZaME3Z0rd_jsa5LpVG5ZbLpvf6cbu8M",
  authDomain: "aviator-781d9.firebaseapp.com",
  projectId: "aviator-781d9",
  storageBucket: "aviator-781d9.firebasestorage.app",

  appId: "1:151636540667:web:a16b6ed543fbf04368c45e"

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let user = null;
const refParam = new URLSearchParams(location.search).get('ref');

function gen(){return 'SKY-'+Math.floor(1000+Math.random()*9000)}

function loginPage(isLogin=false){

        <h1 style="font-size:22px;font-weight:800">Sky Points Club</h1>
        <p style="font-size:12px;color:#6b7280;margin-top:4px">Pakistan's No.1 VIP Earning App</p>
      </div>

      <div id="form" style="display:flex;flex-direction:column;gap:10px">
        ${!isLogin?`<input id="name" class="input" placeholder="Full Name">`:''}

        <input id="pass" class="input" type="password" placeholder="Password (6+ chars)">
        ${!isLogin?`<input id="ref" class="input" placeholder="Referral Code (optional)" value="${refParam||''}" style="background:#fffbeb">`:''}

          <span onclick="${isLogin?'loginPage(false)':'loginPage(true)'}" style="font-size:13px;color:#0a7a2a;font-weight:700;cursor:pointer">${isLogin?'New here? Create Account':'Already have account? Login'}</span>

    </div>
  </div>`;
}

window.doReg=async()=>{
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const pass=document.getElementById('pass').value.trim();
  let ref=document.getElementById('ref').value.trim().toUpperCase();
  const err=document.getElementById('err');
  if(!name||phone.length<11||pass.length<4){err.textContent='Please fill all fields correctly';return}
  err.textContent='Creating...';
  try{
    const q=query(collection(db,'users'),where('phone','==',phone));
    const s=await getDocs(q);
    if(!s.empty){err.textContent='This number already registered';return}
    let bonus=100,referredBy=null,refDoc=null;
    if(ref){
      const rq=query(collection(db,'users'),where('userId','==',ref));
      const rs=await getDocs(rq);
      if(!rs.empty){refDoc=rs.docs[0];referredBy=ref;bonus=200}
    }
    const uid=gen();
    const data={userId:uid,name,phone,password:pass,points:bonus,referralCode:uid,referredBy,referralCount:0,referralEarnings:0,totalEarned:bonus,status:'active',createdAt:new Date().toISOString()};
    await setDoc(doc(db,'users',uid),data);
    if(refDoc){
      await updateDoc(doc(db,'users',refDoc.id),{points:increment(500),referralCount:increment(1),referralEarnings:increment(500),totalEarned:increment(500)});
      await addDoc(collection(db,'referrals'),{referrerId:refDoc.id,referredId:uid,points:500,createdAt:new Date().toISOString()});
    }
    user=data;localStorage.setItem('sky_u',JSON.stringify(user));main();
  }catch(e){err.textContent='Network error, try again'}
}

window.doLogin=async()=>{
  const phone=document.getElementById('phone').value.trim();
  const pass=document.getElementById('pass').value.trim();
  const err=document.getElementById('err');
  err.textContent='Checking...';
  try{
    const q=query(collection(db,'users'),where('phone','==',phone),where('password','==',pass));
    const s=await getDocs(q);
    if(s.empty){err.textContent='Wrong phone or password';return}
    user=s.docs[0].data();localStorage.setItem('sky_u',JSON.stringify(user));main();
  }catch(e){err.textContent='Network error'}
}

function main(){
  if(!user)return loginPage(false);
  document.getElementById('root').innerHTML=`
  <div class="topbar">
    <div class="header"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;opacity:.85">${user.userId} • VIP • ${user.referralCount||0} refs</div><div style="font-size:20px;font-weight:800;margin-top:2px">${user.points} PTS <span style="font-size:11px;font-weight:400;opacity:.85">= ${(user.points/100).toFixed(0)} PKR</span></div></div><button onclick="logout()" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px">Logout</button></div></div>
    <div style="padding:14px"><div id="content"></div></div>
    <div class="nav"><button id="n-earn" class="active" onclick="go('earn')">💰<br>Earn</button><button id="n-play" onclick="go('play')">🎮<br>Play</button><button id="n-refer" onclick="go('refer')">👑<br>Refer</button><button id="n-wallet" onclick="go('wallet')">💳<br>Wallet</button><button id="n-profile" onclick="go('profile')">👤<br>Me</button></div>
  </div>`;
  go('earn');
}

  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('n-'+t); if(el) el.classList.add('active');
  const c=document.getElementById('content');
  if(t=='earn'){
    c.innerHTML=`<div style="margin-bottom:12px"><h2 style="font-size:18px;font-weight:800">Earn Points</h2><p style="font-size:12px;color:#6b7280">Fast tasks, instant points</p></div>
    <div onclick="addPts(10)" class="action" style="background:#2563eb;margin-bottom:10px"><div><div>Small Task — 10 PTS</div><small>5 sec • Tap to earn</small></div><div>›</div></div>
    <div onclick="addPts(30)" class="action" style="background:#7c3aed;margin-bottom:10px"><div><div>Video Task — 30 PTS</div><small>15 sec • Tap to earn</small></div><div>›</div></div>
    <div onclick="addPts(20)" class="action" style="background:#0d9488;margin-bottom:14px"><div><div>Daily Check-in — 20 PTS</div><small>Once per day</small></div><div>›</div></div>
    <div class="card" style="padding:14px"><div style="font-size:12px;color:#6b7280">TIP</div><div style="font-size:13px;font-weight:600;margin-top:4px">Refer 1 friend = 500 PTS = 5 PKR instant. No limit.</div></div>`;
  }
  if(t=='play'){
    c.innerHTML=`<h2 style="font-size:18px;font-weight:800;margin-bottom:12px">Play & Win</h2>
    <div class="grid2"><div onclick="addPts(50)" class="card" style="padding:16px;text-align:center;cursor:pointer"><div style="font-size:24px">🎯</div><div style="font-weight:700;margin-top:6px;font-size:13px">Color Match</div><div style="font-size:11px;color:#6b7280">+50 PTS</div></div>
    <div onclick="addPts(50)" class="card" style="padding:16px;text-align:center;cursor:pointer"><div style="font-size:24px">🔢</div><div style="font-weight:700;margin-top:6px;font-size:13px">Number Tap</div><div style="font-size:11px;color:#6b7280">+50 PTS</div></div>
    <div onclick="addPts(50)" class="card" style="padding:16px;text-align:center;cursor:pointer"><div style="font-size:24px">🃏</div><div style="font-weight:700;margin-top:6px;font-size:13px">Memory Card</div><div style="font-size:11px;color:#6b7280">+50 PTS</div></div>
    <div onclick="addPts(50)" class="card" style="padding:16px;text-align:center;cursor:pointer"><div style="font-size:24px">🎡</div><div style="font-weight:700;margin-top:6px;font-size:13px">Spin Win</div><div style="font-size:11px;color:#6b7280">+50 PTS</div></div></div>`;
  }
  if(t=='refer'){
    const link=`${location.origin}${location.pathname}?ref=${user.referralCode||user.userId}`;
    c.innerHTML=`<h2 style="font-size:18px;font-weight:800">Refer VIP</h2><p style="font-size:12px;color:#6b7280;margin-bottom:12px">1 Refer = 500 PTS = 5 PKR • Lifetime</p>
    <div class="card vip" style="padding:16px;margin-bottom:12px"><div style="font-size:11px;font-weight:800;letter-spacing:.5px">YOUR REFERRAL LINK</div><div id="rlink" style="font-size:12px;font-weight:700;margin-top:8px;word-break:break-all;background:rgba(0,0,0,.08);padding:8px;border-radius:8px">${link}</div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="copyL()" class="btn btn-dark" style="padding:10px;font-size:12px">Copy Link</button><button onclick="shareL()" class="btn btn-light" style="padding:10px;font-size:12px">WhatsApp</button></div></div>
    <div class="grid3" style="margin-bottom:12px"><div class="card" style="padding:12px;text-align:center"><div style="font-size:10px;color:#6b7280">REFERRALS</div><div style="font-weight:800;font-size:16px;margin-top:4px">${user.referralCount||0}</div></div><div class="card" style="padding:12px;text-align:center"><div style="font-size:10px;color:#6b7280">EARNED</div><div style="font-weight:800;font-size:16px;margin-top:4px">${user.referralEarnings||0}</div></div><div class="card" style="padding:12px;text-align:center"><div style="font-size:10px;color:#6b7280">PKR</div><div style="font-weight:800;font-size:16px;margin-top:4px">${((user.referralEarnings||0)/100).toFixed(0)}</div></div></div>
    <div class="card" style="padding:14px"><div style="font-size:12px;font-weight:700">VIP Progress</div><div style="font-size:11px;color:#6b7280;margin-top:2px">Bronze 0 • Silver 10 • Gold 50 • Diamond 100+</div><div style="height:8px;background:#eef0f2;border-radius:20px;margin-top:10px;overflow:hidden"><div style="height:100%;background:#eab308;width:${Math.min(100,(user.referralCount||0))}%;border-radius:20px"></div></div></div>`;
  }
  if(t=='wallet'){
    c.innerHTML=`<h2 style="font-size:18px;font-weight:800;margin-bottom:12px">Wallet</h2>
    <div class="card" style="padding:18px;background:#0a7a2a;color:#fff;margin-bottom:12px"><div style="font-size:11px;opacity:.8">TOTAL BALANCE</div><div style="font-size:32px;font-weight:800;margin-top:4px">${user.points} <span style="font-size:14px;font-weight:400">PTS</span></div><div style="font-size:13px;opacity:.9;margin-top:2px">= ${(user.points/100).toFixed(2)} PKR • Rate: 10000 = 100 PKR</div></div>
    <div class="card" style="padding:16px"><div style="font-size:13px;font-weight:700;margin-bottom:10px">Withdraw to Easypaisa</div><input id="wp" type="number" class="input" placeholder="Points (min 10000)" style="margin-bottom:10px"><input id="wn" class="input" placeholder="Easypaisa Number 03XXXXXXXXX" style="margin-bottom:12px"><button onclick="doWithdraw()" class="btn btn-green">Request Withdraw</button><div id="wmsg" style="font-size:12px;text-align:center;margin-top:10px;color:#0a7a2a"></div><div style="font-size:10px;color:#6b7280;margin-top:10px">Withdraws are manual, approved in 24h by admin.</div></div>`;
  }
  if(t=='profile'){
    c.innerHTML=`<h2 style="font-size:18px;font-weight:800;margin-bottom:12px">My Profile</h2><div class="card" style="padding:16px"><div style="display:flex;gap:12px;align-items:center"><div style="width:48px;height:48px;background:#eef7ee;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a7a2a">${(user.name||'U').charAt(0)}</div><div><div style="font-weight:700">${user.name}</div><div style="font-size:12px;color:#6b7280">${user.phone} • ${user.userId}</div></div></div><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;font-size:13px"><div style="display:flex;justify-content:space-between"><span style="color:#6b7280">Referral Code</span><b>${user.referralCode||user.userId}</b></div><div style="display:flex;justify-content:space-between"><span style="color:#6b7280">Referred By</span><b>${user.referredBy||'-'}</b></div><div style="display:flex;justify-content:space-between"><span style="color:#6b7280">Total Earned</span><b>${user.totalEarned||user.points} PTS</b></div></div></div>`;
  }
}

window.addPts=async(pts)=>{
  const btn=event?.currentTarget; if(btn)btn.style.opacity='.6';
  try{
    await updateDoc(doc(db,'users',user.userId),{points:increment(pts),totalEarned:increment(pts)});
    user.points+=pts;localStorage.setItem('sky_u',JSON.stringify(user));
    go(document.querySelector('.nav button.active')?.id?.replace('n-','')||'earn');
    // lightweight toast
    const t=document.createElement('div');t.textContent=`+${pts} PTS added!`;t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:999';document.body.appendChild(t);setTimeout(()=>t.remove(),1500);
  }catch(e){alert('Check internet')}
  if(btn)btn.style.opacity='1';
}
window.copyL=()=>{const v=document.getElementById('rlink').textContent;navigator.clipboard.writeText(v).then(()=>alert('Link copied!'))}
window.shareL=()=>{const v=document.getElementById('rlink').textContent;window.open('https://wa.me/?text='+encodeURIComponent('Join Sky Points Club VIP - Earn money! My link: '+v),'_blank')}
window.doWithdraw=async()=>{
  const pts=parseInt(document.getElementById('wp').value);const num=document.getElementById('wn').value.trim();const m=document.getElementById('wmsg');
  if(isNaN(pts)||pts<10000){m.textContent='Minimum 10000 PTS';m.style.color='#dc2626';return}
  if(pts>user.points){m.textContent='Not enough balance';m.style.color='#dc2626';return}
  if(num.length<11){m.textContent='Enter valid Easypaisa number';m.style.color='#dc2626';return}
  m.textContent='Sending...';m.style.color='#6b7280';
  try{
    await addDoc(collection(db,'withdrawals'),{userId:user.userId,phone:user.phone,points:pts,pkr:pts/100,easypaisa:num,status:'pending',createdAt:new Date().toISOString()});
    await updateDoc(doc(db,'users',user.userId),{points:increment(-pts)});
    user.points-=pts;localStorage.setItem('sky_u',JSON.stringify(user));
    m.textContent='Request sent! Admin will approve in 24h';m.style.color='#0a7a2a';setTimeout(()=>go('wallet'),1000);
  }catch(e){m.textContent='Error, try again';m.style.color='#dc2626'}
}
window.logout=()=>{localStorage.removeItem('sky_u');location.reload()}

const saved=localStorage.getItem('sky_u');
if(saved){try{user=JSON.parse(saved);main()}catch{loginPage(false)}}else{loginPage(false)}
