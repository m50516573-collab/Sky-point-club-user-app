*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans','Inter',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;max-width:480px;margin:0 auto;position:relative;overflow-x:hidden;}

/* SPLASH — WORLD CLASS BETTER THAN CLAUDE */
#splash{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%, #FFF7ED 0%, #FFFBF5 40%, #FFEAD0 100%);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease, transform .6s ease;}
#splash.hide{opacity:0;transform:scale(1.02);pointer-events:none}
.fox-wrap{position:relative;width:120px;height:120px;margin-bottom:18px}
.fox-glow{position:absolute;inset:-20px;background:radial-gradient(circle, rgba(255,138,30,.25) 0%, rgba(255,138,30,0) 70%);border-radius:50%;animation:pulse 2s infinite}
.fox-logo{position:relative;width:100%;height:100%;background:linear-gradient(180deg,#FFE4C2 0%, #FFD199 100%);border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 20px 60px rgba(255,138,30,.25), 0 4px 16px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.8);animation:float 3s ease-in-out infinite}
.fox-logo::after{content:'';position:absolute;inset:0;border-radius:32px;background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 40%);pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}
.splash-title{font-size:28px;font-weight:800;letter-spacing:-.8px;color:var(--dark);margin-bottom:6px}
.splash-sub{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:4px;height:4px;background:var(--orange);border-radius:50%;animation:dot 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
.splash-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,.06);overflow:hidden}
.splash-bar-fill{height:100%;background:linear-gradient(90deg, var(--orange), var(--orange2), var(--gold));width:0%;animation:load 2.2s ease-in-out forwards}
@keyframes load{0%{width:0%}60%{width:70%}100%{width:100%}}

/* HEADER — GLASS PREMIUM */
#header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(243,232,214,.8);padding:10px 14px;display:flex;align-items:center;gap:8px}
#header .logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(180deg,#FFE4C2,#FFD199);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(255,138,30,.2);flex-shrink:0}
#header .pills{display:flex;gap:6px;margin-left:auto;align-items:center}
.pill{background:rgba(255,247,237,.9);border:1px solid #F3E8D6;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;color:var(--dark);backdrop-filter:blur(8px)}
.coin-pill{background:linear-gradient(180deg,#FFF7ED,#FFE4C2);border:1.5px solid #FFD79E;box-shadow:0 2px 8px rgba(255,138,30,.15)}
.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8B5CF6,#6366F1);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(139,92,246,.3);flex-shrink:0}
.lambi{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(0,0,0,.06);z-index:999;display:none}
.lambi .fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));width:0%;transition:width .1s}
.lambi.show{display:block}

/* DRAWER */
#drawer-overlay{display:none;position:fixed;inset:0;background:rgba(26,18,7,.4);backdrop-filter:blur(4px);z-index:200}
#drawer-overlay.open{display:block}
#drawer{position:fixed;top:0;left:-320px;width:300px;height:100vh;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);z-index:300;transition:left .4s cubic-bezier(.16,1,.3,1);overflow-y:auto;padding:20px 16px;border-right:1px solid #F3E8D6}
#drawer.open{left:0}
.d-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;cursor:pointer;margin-bottom:4px;font-size:14px;font-weight:600;color:var(--dark);border:none;background:transparent;width:100%;transition:.2s}

.d-item.challenge{background:linear-gradient(180deg,#FFF7ED,#FFE4C2);border:1.5px solid #FFD79E;color:var(--orange)}

.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border:1px solid rgba(243,232,214,.9);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 24px rgba(26,18,7,.06), 0 1px 4px rgba(26,18,7,.04);transition:.2s}

.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;gap:3px;cursor:pointer;font-size:10px;font-weight:600;color:var(--muted);border:none;background:transparent;border-radius:16px;transition:.25s}

.input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,30,.15);background:#fff}
.btn-orange{width:100%;padding:14px;background:linear-gradient(135deg,#FF8A1E,#FF6A00);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(255,138,30,.3), inset 0 1px 0 rgba(255,255,255,.3);transition:.2s}
.btn-orange:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(255,138,30,.4)}
.btn-dark{width:100%;padding:14px;background:linear-gradient(135deg,#1A1207,#2B2117);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(26,18,7,.2);transition:.2s}
</style>
