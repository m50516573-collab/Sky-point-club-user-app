window.doAction=async()=>{
  const msg=document.getElementById('msg'); const btn=document.getElementById('mainBtn');
  const phone=document.getElementById('ph')?.value.trim();
  const pass=document.getElementById('ps')?.value.trim();
  if(!phone||phone.length<11){msg.style.color='#FF5252'; msg.textContent='❌ Enter valid phone'; return}
  if(!pass||pass.length<3){msg.style.color='#FF5252'; msg.textContent='❌ Enter password'; return}
  if(mode==='signup'){
    const name=document.getElementById('nm')?.value.trim();
    if(!name){msg.style.color='#FF5252'; msg.textContent='❌ Enter name'; return}
    let ref=document.getElementById('rf')?.value.trim().toUpperCase();
    btn.disabled=true; btn.textContent='⏳ Creating VIP...'; msg.style.color='#7A9A7A'; msg.textContent='Creating...';
    try{
      const all=await getDocs(collection(db,'users'));
      let dup=false; all.forEach(d=>{if(d.data().phone===phone) dup=true});
      if(dup){msg.style.color='#FF5252'; msg.textContent='❌ Already registered — Login tab'; btn.disabled=false; btn.textContent='CREATE ACCOUNT — GREEN YELLOW VIP'; return}
      let bonus=100, referredBy=null, refId=null;
      if(ref){all.forEach(d=>{if(d.data().userId===ref){refId=d.id; referredBy=ref; bonus=200}})}
      const newId=gen();
      const data={userId:newId,name,phone,password:pass,points:bonus,referralCode:newId,referredBy,referralCount:0,referralEarnings:0,totalEarned:bonus,status:'active',createdAt:new Date().toISOString()};

  }else{
    btn.disabled=true; btn.textContent='⚡ Logging in...'; msg.style.color='#7A9A7A'; msg.textContent='Checking...';
    try{
      const all=await getDocs(collection(db,'users'));
      if(all.empty){msg.style.color='#FF5252'; msg.textContent='❌ No accounts — Sign Up first'; btn.disabled=false; btn.textContent='⚡ FAST LOGIN — CLICK HERE'; return}
      let found=null, phoneExists=false;
      all.forEach(d=>{const dd=d.data(); if(dd.phone===phone) phoneExists=true; if(dd.phone===phone && dd.password===pass) found=dd;});

  }

  ov.innerHTML=`<div class="card" style="width:100%;max-width:360px;text-align:center;padding:24px;background:#111A11"><div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted)">AD • ${adUnit}</div><div style="font-size:48px;margin-top:16px">📺</div><div style="font-family:'Syne';font-weight:800;margin-top:12px;font-size:18px">Watch Ads Earn Points</div><div style="font-size:12px;color:var(--muted);margin-top:6px">Rewarded Ad • +${pts} PTS • ${adUnit}</div><div style="height:6px;background:#0F1A0F;border-radius:100px;margin-top:18px;overflow:hidden;border:1px solid var(--line)"><div id="bar" style="height:100%;width:0%;background:linear-gradient(90deg,#22C55E,#FACC15);transition:width .1s"></div></div><div id="sec" style="font-size:11px;color:var(--muted);margin-top:8px;font-weight:700">5s remaining</div><button id="col" style="margin-top:18px;width:100%;background:linear-gradient(135deg,#22C55E,#FACC15);color:#0A1A0A;border:none;padding:14px;border-radius:12px;font-weight:800;display:none">Collect +${pts} PTS • AdMob</button><div style="font-size:9px;color:var(--muted);margin-top:10px">Ad Unit: ${adUnit}<br>App ID: ca-app-pub-1723730011184925~4524533479</div></div>`;
  document.body.appendChild(ov);
  let s=5; const bar=document.getElementById('bar'); const sec=document.getElementById('sec'); const btn=document.getElementById('col');
  const it=setInterval(()=>{s-=0.08; bar.style.width=((5-s)/5*100)+'%'; sec.textContent=Math.ceil(s)+'s remaining'; if(s<=0){clearInterval(it); bar.style.width='100%'; sec.textContent='✅ Ad Completed!'; btn.style.display='block'}},80);

    try{
      await updateDoc(doc(db,'users',user.userId),{points:increment(pts),totalEarned:increment(pts)});

  }
}

window.doW=async()=>{
  const pts=parseInt(document.getElementById('wp').value); const num=document.getElementById('wn').value.trim(); const m=document.getElementById('wm');
  if(isNaN(pts)||pts<10000){m.textContent='❌ Min 10000 PTS'; m.style.color='#FF5252'; return}
  if(pts>user.points){m.textContent='❌ Not enough balance'; m.style.color='#FF5252'; return}
  if(num.length<11){m.textContent='❌ Enter valid Easypaisa number'; m.style.color='#FF5252'; return}
  m.textContent='⏳ Sending...'; m.style.color='#7A9A7A';
  try{await addDoc(collection(db,'withdrawals'),{userId:user.userId,phone:user.phone,points:pts,pkr:pts/100,easypaisa:num,status:'pending',createdAt:new Date().toISOString()}); await updateDoc(doc(db,'users',user.userId),{points:increment(-pts)}); user.points-=pts; localStorage.setItem('sky_world',JSON.stringify(user)); m.textContent='✅ Sent! Easypaisa 24h approval'; m.style.color='#22C55E'; setTimeout(()=>go('wallet'),1000);}catch(e){m.textContent='❌ '+e.message; m.style.color='#FF5252'}
}

const saved=localStorage.getItem('sky_world')||localStorage.getItem('sky_final')||localStorage.getItem('sky_u');
