function getAdLimits() {

}

  const limits = getAdLimits();

function incrementAdCount(type) {
  const limits = getAdLimits();
  limits[type] = (limits[type] || 0) + 1;
  if (!limits.resetTime) limits.resetTime = Date.now() + 8*60*60*1000;

function getTimeLeft() {
